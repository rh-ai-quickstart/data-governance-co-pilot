{{- if .Values.model.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.distribution.name }}-api-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "copilot-llama-stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  api_key: {{ .Values.model.apiKey | quote }}
{{- end }}
