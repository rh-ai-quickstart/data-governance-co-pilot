# LlamaStackDistribution configuration
distribution:
  name: copilot-llama-stack
  # Distribution image name (must match run.yaml image_name)
  imageName: "rh-dev"
  replicas: 1

# Container configuration
container:
  name: llama-stack
  port: 8321
  # Resource limits for Llama Stack container
  # Note: Llama Stack is a lightweight proxy - does not need much CPU
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# LLM Model configuration (aligned with nemotron-model or external deployment)
model:
  # Model name (e.g., nvidia-nemotron-nano-9b-v2)
  # If DEPLOY_MODEL=true, this will be auto-populated
  name: "redhataillama-31-8b-instruct"
  # vLLM service URL
  # Format: https://{model-name}-predictor.{namespace}.svc.cluster.local:8443/v1
  # If DEPLOY_MODEL=true, this will be auto-generated
  url: "https://redhataillama-31-8b-instruct-quickstarts-llm.apps.ai-dev02.kni.syseng.devcluster.openshift.com/v1"
  # API key for vLLM service
  # If DEPLOY_MODEL=true, this will be auto-extracted from service account secret
  apiKey: "eyJhbGciOiJSUzI1NiIsImtpZCI6IjdzMF9PR3FmdjlOUHduOGl6akxaNTVjbW1rd19lSnBiVzBEQ3Q1NGpKbUkifQ..VKXKcup-6xRrxzR4DP5fsWx1JSph-RjXRxB2h77wx9gGPERz2wnoGn0q2wi7qSuhuH25X6jLH5xQWF0TCFj8sFTj2xcX02YNsWO5QLhEPy23p-NEzrHdCXdLGXM0uGdKA_ZwLn0gwmui_Ey_K35VvTB8YyqiqpX3cEQLEEcq8jm3d0BpwtVyw5jtVMR5u9FlHRgXTq2lGEqWD2r9qQxxWED_dVO3BshveWUzZM1fp0CoDrcad8JLU5wknCFcE7FxlF5q8w-1WmO9W7b3lVrxaMpFF3gZipsQYXUk7xB0MXQZGUeJAzRDfZY452r-hixX7vKyefABA1w6xPiusUwKgS11m4zTcXeAuAweeoZWEl8f8wGOJEi360BWZ6mY37W4Qsj1nTtLuOefIaLrB2KIuqNW9QYJMKCGxesiiLW5ghsNrKEPqnj3juvWkzjHPFf-cisVqe71ZyQEEdlmR45AuOUnLQhqb9YcmiVT4XoK0SbU0soXs_QVEpAISKgRyBIyj-IBh_TCAjiWxzcJrXkJXC2Anc0o8UK59x5GYYU17Nbgz1b6c0XdAlpZB7zEc_0HQDowpR35xLrbeEM6kY2AkZ4x8VVkCxlCUOViXkUv0xavNRDN6H9dgMag1c7JsJ3q6qJbspH6H68lgoNPqdqVi_Y6fHc1xlGR7OW6zmgCOkU"

# MCP Server configuration
mcp:
  # MCP service name (same instance, transport configured via PROVIDER_MODE)
  serviceName: "pg-airman-mcp-service"
  # MCP service port
  port: 8000

# Llama Stack run.yaml configuration
config:
  # APIs to enable
  apis:
    - inference
    - agents
    - safety
    - vector_io
    - tool_runtime

  # Storage configuration
  storage:
    # Database paths (operator-provided volume mount)
    basePath: "/opt/app-root/src/.llama/distributions/rh"
    # Backends
    kvBackend:
      type: kv_sqlite
      dbName: metadata.db
    sqlBackend:
      type: sql_sqlite
      dbName: conversations.db

# Route configuration
route:
  enabled: true
  # Route name will be: llama-stack-api
  name: llama-stack-api
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
