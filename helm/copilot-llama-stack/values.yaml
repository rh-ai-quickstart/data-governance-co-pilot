# LlamaStackDistribution configuration
distribution:
  name: copilot-llama-stack
  # Distribution image name (must match run.yaml image_name)
  imageName: "rh-dev"
  replicas: 1

# Container configuration
container:
  name: llama-stack
  port: 8321
  # Resource limits for Llama Stack container
  # Note: Llama Stack is a lightweight proxy - does not need much CPU
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# LLM Model configuration
# NOTE: These values are populated at deployment time from copilot-backend/values.yaml
# via the Makefile. The values here are just empty placeholders.
#
# Source of truth: helm/copilot-backend/values.yaml (llm section - shared by both modes)
#
# Deployment paths:
# 1. DEPLOY_MODEL=true: Extracted from deployed model (InferenceService)
# 2. DEPLOY_MODEL=false: Read from copilot-backend/values.yaml (llm.baseUrl, llm.model, llm.apiKey)
# 3. CLI override: Pass copilot.llmBaseUrl, copilot.llmModel, copilot.llmApiKey to make install
model:
  # Model name (populated via --set model.name=... from Makefile)
  # Note: Llama Stack requires OpenAI-compatible function calling format
  name: ""
  # vLLM service URL (populated via --set model.url=... from Makefile)
  url: ""
  # API key for vLLM service (populated via --set model.apiKey=... from Makefile, or left empty)
  apiKey: ""

# MCP Server configuration
mcp:
  # MCP service name (same instance, transport configured via PROVIDER_MODE)
  serviceName: "pg-airman-mcp-service"
  # MCP service port
  port: 8000

# Llama Stack run.yaml configuration
config:
  # APIs to enable
  apis:
    - inference
    - agents
    - safety
    - vector_io
    - tool_runtime

  # Storage configuration
  storage:
    # Database paths (operator-provided volume mount)
    basePath: "/opt/app-root/src/.llama/distributions/rh"
    # Backends
    kvBackend:
      type: kv_sqlite
      dbName: metadata.db
    sqlBackend:
      type: sql_sqlite
      dbName: conversations.db

# Route configuration
route:
  enabled: true
  # Route name will be: llama-stack-api
  name: llama-stack-api
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
