apiVersion: batch/v1
kind: Job
metadata:
  name: pgvector-data-loader
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pgvector-data-loader
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgvector-data-loader
    spec:
      restartPolicy: Never
      containers:
        - name: data-loader
          image: {{ .Values.dataLoader.image | default (printf "image-registry.openshift-image-registry.svc:5000/%s/pgvector-data-loader:latest" .Release.Namespace) }}
          imagePullPolicy: Always
          env:
            - name: POSTGRES_HOST
              value: "pgvector-0.pgvector-postgres-service.{{ .Release.Namespace }}.svc.cluster.local"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vector-database
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vector-database
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vector-database
                  key: DATABASE_NAME
