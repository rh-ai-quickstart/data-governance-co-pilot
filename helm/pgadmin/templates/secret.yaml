apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pgadmin
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
type: Opaque
stringData:
  # pgAdmin login credentials
  PGADMIN_DEFAULT_EMAIL: {{ .Values.pgadmin.email | quote }}
  PGADMIN_DEFAULT_PASSWORD: {{ .Values.pgadmin.password | quote }}
  # PostgreSQL connection credentials for pre-configured server (passed from Makefile via postgres.userId parameter)
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DATABASE: {{ .Values.postgres.database | quote }}
