replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/NAMESPACE/copilot-ui
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""  # Will be auto-generated by OpenShift if empty

# Backend Configuration
# This will be injected as VITE_COPILOT_BACKEND_URL at build time
backend:
  # Use the copilot-backend route URL (will be set dynamically during install)
  url: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
