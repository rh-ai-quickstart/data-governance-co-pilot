replicaCount: 2

image:
  repository: quay.io/rh-ai-quickstart/copilot-ui
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""  # Will be auto-generated by OpenShift if empty

# Backend Configuration
# This is injected via ConfigMap as /config.js at runtime
# The UI will load this from /config.js which is mounted from the ConfigMap
backend:
  # Use the copilot-backend route URL (will be set dynamically during install)
  url: ""

resources:
  limits:
    cpu: 500m
    memory: 256Mi
    ephemeral-storage: 2Gi
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 1Gi

livenessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 5
