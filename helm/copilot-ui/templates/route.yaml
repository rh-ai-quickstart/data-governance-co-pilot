{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "copilot-ui.fullname" . }}
  labels:
    app: {{ include "copilot-ui.name" . }}
    chart: {{ include "copilot-ui.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    # Enable cookie-based session affinity for load balancing across UI replicas
    haproxy.router.openshift.io/disable_cookies: 'false'
    haproxy.router.openshift.io/balance: roundrobin
    haproxy.router.openshift.io/cookie_name: 'copilot-ui-route'
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "copilot-ui.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
