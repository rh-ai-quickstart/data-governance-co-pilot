apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "copilot-ui.fullname" . }}-config
  labels:
    {{- include "copilot-ui.labels" . | nindent 4 }}
data:
  config.js: |
    /**
     * Runtime configuration for copilot-ui
     * Generated by Helm from backend.url value
     */
    window.__RUNTIME_CONFIG__ = {
      backendUrl: {{ .Values.backend.url | quote }}
    };
