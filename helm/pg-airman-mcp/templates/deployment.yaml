apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-airman-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pg-airman-mcp
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: pg-airman-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pg-airman-mcp
    spec:
      containers:
        - name: pg-airman-mcp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "pg-airman-mcp"
            - "--transport={{ .Values.mcp.transport }}"
            - "--access-mode={{ .Values.mcp.accessMode }}"
            {{- if eq .Values.mcp.transport "sse" }}
            - "--sse-port={{ .Values.mcp.port }}"
            {{- else if eq .Values.mcp.transport "streamable-http" }}
            - "--streamable-http-port={{ .Values.mcp.port }}"
            {{- end }}
          ports:
            {{- if or (eq .Values.mcp.transport "sse") (eq .Values.mcp.transport "streamable-http") }}
            - containerPort: {{ .Values.mcp.port }}
              protocol: TCP
              name: mcp
            {{- end }}
          env:
            - name: DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: pg-airman-mcp-secret
                  key: DATABASE_URI
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          {{- if or (eq .Values.mcp.transport "sse") (eq .Values.mcp.transport "streamable-http") }}
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          {{- end }}
