apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: copilot-backend
  labels:
    app: copilot-backend
spec:
  output:
    to:
      kind: ImageStreamTag
      name: copilot-backend:latest
  source:
    type: Dockerfile
    dockerfile: |
      # Build stage - install dependencies
      FROM python:3.12-slim AS builder

      # Install uv for fast dependency management
      RUN pip install --no-cache-dir uv

      # Set working directory
      WORKDIR /app

      # Copy project files INCLUDING lock file
      COPY uv.lock /app/
      COPY pyproject.toml /app/
      COPY packages/copilot/pyproject.toml /app/packages/copilot/
      COPY packages/copilot/README.md /app/packages/copilot/
      COPY packages/copilot/src /app/packages/copilot/src

      # Install dependencies using uv sync with frozen lock file
      # --frozen ensures uv.lock is used without modification
      # --no-editable installs the copilot package into the venv so the runtime stage doesn't need the source tree
      RUN uv sync --frozen --no-dev --no-editable

      # Runtime stage
      FROM python:3.12-slim

      # Install runtime dependencies
      RUN apt-get update && apt-get install -y --no-install-recommends \
          dnsutils \
          iputils-ping \
          net-tools \
          && rm -rf /var/lib/apt/lists/*

      # Copy virtual environment from builder (uv sync creates .venv in /app)
      COPY --from=builder /app/.venv /app/.venv

      # OpenShift compatibility: support arbitrary user IDs
      RUN chmod -R g=u /app && \
          chgrp -R 0 /app

      WORKDIR /app

      # Expose port
      EXPOSE 8080

      # Run the FastAPI server
      CMD ["/app/.venv/bin/python", "-m", "copilot"]
  strategy:
    type: Docker
    dockerStrategy:
      from:
        kind: DockerImage
        name: python:3.12-slim
  triggers: []
