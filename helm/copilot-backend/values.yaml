replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/NAMESPACE/copilot-backend
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""  # Will be auto-generated by OpenShift if empty
  timeout: "600s"  # Route timeout for long-running LLM queries with multi-step reasoning (10 minutes)

# Provider Configuration
provider:
  # Provider mode: mcp_direct (default) or llama_stack
  mode: "mcp_direct"

# MCP Server Configuration
mcp:
  serviceUrl: "http://pg-airman-mcp-service:8000"

# LLM Configuration (MCP-Direct mode only)
llm:
  # baseUrl: "https://nvidia-nemotron-nano-9b-v2-samouelian-mcp.apps.ai-dev01.kni.syseng.devcluster.openshift.com/v1"
  # baseUrl: "https://redhataillama-31-8b-instruct-quickstarts-llm.apps.ai-dev02.kni.syseng.devcluster.openshift.com"
  # baseUrl: "https://nvidia-nemotron-nano-9b-v2-data-governance-copilot.apps.4b3c5885-edbqs.openshiftpartnerlabs.com/v1"
  baseUrl: 	https://litellm-prod.apps.maas.redhatworkshops.io/v1
  model: qwen3-14b
  # model: "nvidia-nemotron-nano-9b-v2"
  # model: "redhataillama-31-8b-instruct"
  # API key for LLM service
  # IMPORTANT: Do not commit API keys to Git!
  # Pass via: make copilot-backend-install copilot.llmApiKey=your-key
  # For vLLM servers without authentication, use "not-needed"
  apiKey: ""  # Must be provided at deployment time
  # Maximum context length (tokens) for the LLM model
  # Should match or be slightly less than the model's --max-model-len setting
  # Default: 32768 (matches NVIDIA Nemotron Nano 9B v2 default)
  maxContextLength: 32768 #Note: When deploying your own model, you must configure your model with a max length as well. It may equal to or greater than this value.
  # Tool call format: auto (default, detects from model name), nemotron, or openai
  toolCallFormat: "auto"

# Llama Stack Configuration (Llama Stack mode only)
llamaStack:
  baseUrl: "https://litellm-prod.apps.maas.redhatworkshops.io/v1"
  model: "qwen3-14b"  # Model name without provider prefix (vllm-inference/ added automatically)

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10  # Increased from 5s to handle busy server during long LLM queries
  failureThreshold: 6  # Increased from 3 to allow up to 60s of health check failures before restart

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 10  # Increased from 5s to handle busy server during long LLM queries
  failureThreshold: 6  # Increased from 3 to be more tolerant of temporary slowdowns
