replicaCount: 1

image:
  repository: image-registry.openshift-image-registry.svc:5000/NAMESPACE/copilot-backend
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""  # Will be auto-generated by OpenShift if empty
  timeout: "90s"  # Route timeout for long-running LLM queries

# MCP Server Configuration
mcp:
  serviceUrl: "http://pg-airman-mcp-service:8000"

# LLM Configuration
llm:
  baseUrl: "https://nvidia-nemotron-nano-9b-v2-data-governance-copilot.apps.4b3c5885-edbqs.openshiftpartnerlabs.com/v1"
  model: "nvidia-nemotron-nano-9b-v2"
  # API key for LLM service
  # IMPORTANT: Do not commit API keys to Git!
  # Pass via: make copilot-backend-install copilot.llmApiKey=your-key
  # For vLLM servers without authentication, use "not-needed"
  apiKey: ""  # Must be provided at deployment time

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
