replicaCount: 1

image:
  repository: quay.io/rh-ai-quickstart/copilot-backend
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

route:
  enabled: true
  host: ""  # Will be auto-generated by OpenShift if empty
  timeout: "600s"  # Route timeout for long-running LLM queries with multi-step reasoning (10 minutes)

# Provider Configuration
provider:
  # Provider mode: mcp_direct (default) or llama_stack
  mode: "mcp_direct"

# MCP Server Configuration
mcp:
  serviceUrl: "http://pg-airman-mcp-service:8000"

# Llama Stack Configuration (only used when provider.mode=llama_stack)
llamaStack:
  # Llama Stack service URL (internal Kubernetes service)
  # This is populated automatically by the Makefile
  baseUrl: "http://copilot-llama-stack-service:8321"

# LLM Configuration (used for both MCP-Direct and Llama Stack modes)
llm:
  # LLM endpoint URL (e.g., vLLM server, OpenAI-compatible endpoint, litellm proxy)
  # Examples:
  #   - Deployed model: "https://qwen3-14b-namespace.apps.cluster.com/v1"
  #   - External endpoint: "https://litellm-prod.apps.maas.redhatworkshops.io/v1"
  # baseUrl: "https://nvidia-nemotron-nano-9b-v2-samouelian-mcp.apps.ai-dev01.kni.syseng.devcluster.openshift.com/v1"
  # baseUrl: https://litellm-prod.apps.maas.redhatworkshops.io/v1
  baseUrl: ""

  # Model name
  # For MCP-Direct mode: Used as-is (e.g., "qwen3-14b", "nvidia-nemotron-nano-9b-v2")
  # For Llama Stack mode: Prefixed with "vllm-inference/" automatically
  #model: qwen3-14b
  model: ""
  # model: "nvidia-nemotron-nano-9b-v2"

  # API key for LLM service
  # IMPORTANT: Do not commit API keys to Git!
  # Pass via: make install llm.apiKey=your-key
  # For vLLM servers without authentication, use "not-needed" or leave empty
  apiKey: ""  # Must be provided at deployment time

  # Maximum context length (tokens) for the LLM model
  # Should match or be slightly less than the model's --max-model-len setting
  # Default: 32768 (matches NVIDIA Nemotron Nano 9B v2 default)
  maxContextLength: 32768 #Note: When deploying your own model, you must configure your model with a max length as well. It may equal to or greater than this value.

  # Tool call format: auto (default, detects from model name), nemotron, or openai
  # Only used in MCP-Direct mode (Llama Stack always uses OpenAI format)
  toolCallFormat: "auto"

# Logging Configuration
logging:
  # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  level: "INFO"

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10  # Increased from 5s to handle busy server during long LLM queries
  failureThreshold: 30  # Increased to allow up to 5 minutes (300s) of health check failures before restart

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 10  # Increased from 5s to handle busy server during long LLM queries
  failureThreshold: 60  # Increased to allow up to 5 minutes (300s) of health check failures before marking not ready
