{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "copilot-backend.fullname" . }}
  labels:
    app: {{ include "copilot-backend.name" . }}
    chart: {{ include "copilot-backend.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout | default "90s" | quote }}
    haproxy.router.openshift.io/timeout-tunnel: {{ .Values.route.timeout | default "90s" | quote }}
    haproxy.router.openshift.io/timeout-check: "10s"  # Health check timeout
    haproxy.router.openshift.io/timeout-client: {{ .Values.route.timeout | default "90s" | quote }}  # Client-side timeout
spec:
  {{- if .Values.route.host }}
  host: {{ .Values.route.host }}
  {{- end }}
  to:
    kind: Service
    name: {{ include "copilot-backend.fullname" . }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
{{- end }}
