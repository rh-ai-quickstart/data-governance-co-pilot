apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "copilot-backend.fullname" . }}
  labels:
    app: {{ include "copilot-backend.name" . }}
    chart: {{ include "copilot-backend.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "copilot-backend.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ include "copilot-backend.name" . }}
        release: {{ .Release.Name }}
    spec:
      # Pod-level security context
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: copilot-backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        # Container-level security context
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          runAsNonRoot: true
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        # Logging Configuration
        - name: LOG_LEVEL
          value: "{{ .Values.logging.level }}"

        # CORS Security Configuration
        # Restrict which origins can make authenticated requests to prevent CSRF
        - name: COPILOT_UI_ORIGIN
          value: "{{ .Values.cors.allowedOrigins }}"

        # Provider Configuration
        - name: COPILOT_PROVIDER_MODE
          value: "{{ .Values.provider.mode }}"

        # MCP Server Configuration (both modes)
        - name: PG_AIRMAN_MCP_SERVICE_PORT
          value: "{{ .Values.mcp.serviceUrl }}"
        - name: PG_AIRMAN_MCP_SERVICE_URL
          value: "{{ .Values.mcp.serviceUrl }}"

        # MCP-Direct Mode Configuration
        - name: LLM_BASE_URL
          value: "{{ .Values.llm.baseUrl }}"
        - name: LLM_MODEL
          value: "{{ .Values.llm.model }}"
        - name: LLM_MAX_CONTEXT_LENGTH
          value: "{{ .Values.llm.maxContextLength }}"
        - name: LLM_TOOL_CALL_FORMAT
          value: "{{ .Values.llm.toolCallFormat }}"
        - name: LLM_TEMPERATURE
          value: "{{ .Values.llm.temperature }}"
        - name: LLM_MIN_P
          value: "{{ .Values.llm.minP }}"
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "copilot-backend.fullname" . }}
              key: LLM_API_KEY

        # Llama Stack Mode Configuration
        - name: LLAMA_STACK_BASE_URL
          value: "{{ .Values.llamaStack.baseUrl }}"
        - name: LLAMA_STACK_MODEL
          value: "vllm-inference/{{ .Values.llm.model }}"

        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
