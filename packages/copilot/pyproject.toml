[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "copilot"
version = "0.1.0"
description = "Copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "llama-stack-client~=0.3.5",
    "mcp[cli]>=1.23.1",
    "openai>=1.57.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
copilot = "copilot.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]
